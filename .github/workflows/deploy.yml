name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

# 配置 GITHUB_TOKEN 写权限（允许自动推送到 gh-pages 分支）
permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      # 使用 peaceiris/actions-gh-pages 直接推送到 gh-pages 分支
      # 彻底绕过 GitHub Actions 的 Artifact 存储配额限制（不占用任何 Artifact Storage Quota）
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
